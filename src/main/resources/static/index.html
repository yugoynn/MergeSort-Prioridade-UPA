<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fila UPA - Merge Sort</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Fila de Prioridade da UPA</h1>
    <p class="subtitulo">Ordenação com Merge Sort: primeiro pela cor, depois pela idade (mais velho primeiro)</p>

    <form id="form">
        <input id="nome" placeholder="Nome" required>
        <input id="idade" type="number" min="0" max="130" placeholder="Idade" required>
        <select id="cor">
            <option>Vermelho</option>
            <option>Laranja</option>
            <option>Amarelo</option>
            <option>Verde</option>
            <option>Azul</option>
        </select>
        <button type="submit">Cadastrar</button>
    </form>

    <div class="colunas">
        <section>
            <h2>Ordem de chegada</h2>
            <ol id="chegada"></ol>
        </section>
        <section>
            <h2>Fila ordenada (Merge Sort)</h2>
            <button id="chamar">Chamar próximo</button>
            <p id="chamado"></p>
            <ol id="fila"></ol>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
